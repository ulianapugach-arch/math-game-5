.page{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px 12px 12px}
.brand{color:#fff;text-align:center;font-weight:1000;font-size:clamp(1.25rem,2.5vw,2.05rem);line-height:1.02;letter-spacing:.02em;text-shadow:0 3px 0 #13366c,0 5px 12px #061a3d;margin:0 0 7px}
.brand span{display:block;color:#ffdf5a;font-size:.66em;margin-top:4px}
.card{width:min(620px,94vw);background:rgba(255,252,243,.88);border:3px solid rgba(255,255,255,.94);border-radius:20px;box-shadow:0 7px 0 rgba(9,35,73,.40),0 14px 36px #071c3b66;padding:clamp(12px,1.8vw,20px);margin:auto 0 9px;backdrop-filter:blur(5px)}
.top{display:flex;align-items:center;justify-content:space-between;gap:7px;flex-wrap:wrap}
.pill{border-radius:999px;padding:5px 10px;background:#ffda51;border:2px solid #f2b91b;font-weight:900;font-size:.88rem}
.score{background:#e7f2ff;border-color:#a8c9f0}
.progress{height:9px;border-radius:999px;background:#dce5ef;overflow:hidden;margin:9px 0 13px}
.progress div{height:100%;width:0;background:linear-gradient(90deg,#ffbf24,#62d6a3);transition:width .3s}
.task-title{font-size:clamp(1rem,2vw,1.25rem);font-weight:900;margin:0 0 4px}
.instruction{color:#536783;margin:0 0 10px;font-size:.83rem;line-height:1.35}
.question{font-size:clamp(1.05rem,2.1vw,1.35rem);font-weight:850;line-height:1.3;margin:8px 0 12px}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.option{display:flex;align-items:center;gap:8px;text-align:left;background:#fff;border:2px solid #a8bbd4;border-radius:11px;padding:8px 11px;font-weight:800;cursor:pointer;min-height:42px;color:#163263}
.option:has(input:checked){border-color:#f0b91c;background:#fff4c8;box-shadow:0 0 0 2px #ffdb4a55}
.option input{accent-color:#1558a8;transform:scale(1.15)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.field{display:flex;flex-direction:column;gap:6px;font-weight:800}
input[type=text],input[type=number]{width:100%;font:inherit;font-size:1rem;font-weight:750;color:#18325e;border:2px solid #b7c9de;background:#fff;border-radius:10px;padding:9px;min-width:0}
input:focus{outline:3px solid #9bc7ff;border-color:#2d6ec1}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
button{font:inherit;font-weight:900;border:0;border-radius:11px;padding:10px 14px;cursor:pointer;transition:transform .12s,filter .12s;font-size:.9rem}
button:hover{filter:brightness(1.05);transform:translateY(-1px)}
button:focus-visible{outline:3px solid #f4bd22;outline-offset:3px}
.primary{background:linear-gradient(#2469bd,#154c96);color:white;box-shadow:0 4px 0 #0c3268;flex:1}
.secondary{background:#ffe16b;color:#46360a;box-shadow:0 4px 0 #d4a82b}
.feedback{display:none;margin-top:10px;border-radius:12px;padding:10px 12px;font-weight:750;line-height:1.4;font-size:.92rem}
.feedback.show{display:block}.feedback.good{background:#dff8e9;border:2px solid #83d4a5;color:#145a37}.feedback.bad{background:#fff0d5;border:2px solid #ffd16a;color:#704800}
.path{display:flex;justify-content:center;align-items:center;gap:clamp(3px,1vw,10px);margin:0 0 6px;flex-wrap:wrap;max-width:96vw}
.step{width:clamp(28px,3.2vw,38px);height:clamp(28px,3.2vw,38px);border-radius:50%;display:grid;place-items:center;background:#e5edf8;color:#45607d;border:2px solid white;font-weight:900;box-shadow:0 3px 7px #081f4388;position:relative;font-size:.9rem}
.step.done{background:#ffda4b;color:#18325e;border-color:#fff6c4;box-shadow:0 0 0 3px #ffda4b66}
.step.current{background:#fff;color:#174c91;border-color:#ffcf32;transform:scale(1.13)}
.step:not(:last-child):after{content:"";position:absolute;width:clamp(4px,1.3vw,13px);height:4px;background:#fff;left:100%;top:50%;transform:translateY(-50%)}
.footer{color:white;text-shadow:0 2px 4px #00132e;font-weight:800;text-align:center;font-size:.8rem;margin-top:0}
.summary{text-align:center}.summary .emoji{font-size:4rem}.summary h2{margin:8px 0;font-size:clamp(1.6rem,4vw,2.4rem)}.answers{text-align:left;background:#eef5ff;border-radius:14px;padding:14px 18px;margin-top:16px;line-height:1.7}
@media(max-width:540px){.fields,.options{grid-template-columns:1fr}.card{border-width:2px;padding:12px;width:min(520px,96vw)}.brand{margin-top:3px}.page{padding:8px 8px 10px}.path{gap:4px}.step{width:28px;height:28px;font-size:.78rem}.option{min-height:40px}.actions button{flex:1}.instruction{font-size:.8rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="page">
  <h1 class="brand">МАТЕМАТИЧНА ПРИГОДА <span>РАЗОМ ДО ГРУ!</span></h1>
  <main class="card" id="game">
    <div class="top">
      <div class="pill" id="taskNumber">Завдання 1 із 9</div>
      <div class="pill score">⭐ Бали: <span id="score">0</span> / 9</div>
    </div>
    <div class="progress" aria-label="Прогрес проходження"><div id="progressBar"></div></div>
    <h2 class="task-title" id="taskTitle">Рівень 1. Розігрів</h2>
    <p class="instruction">Розв’язуй завдання по черзі. Якщо відповідь правильна, помічник робить крок до Гру. Якщо помилився — спробуй ще раз!</p>
    <section id="questionArea"></section>
    <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
    <div class="actions">
      <button class="primary" id="checkBtn">Перевірити відповідь</button>
      <button class="secondary" id="hintBtn">💡 Підказка</button>
      <button class="secondary" id="restartBtn">↻ Спочатку</button>
    </div>
    <div class="feedback" id="hintBox"></div>
  </main>
  <div class="path" id="path" aria-label="Шлях помічника до Гру"></div>
  <div class="footer">Кожна правильна відповідь наближає до фінішу! 🍌</div>
</div>
<script>
const tasks = [
 {title:"Рівень 1. Розігрів",type:"choice",q:"1. Обчисли добуток 165 · 36.",options:["5840","4840","4940","5940"],correct:3,hint:"Обчисли 165 · (30 + 6), а потім додай два добутки.",explain:"165 · 36 = 165 · 30 + 165 · 6 = 4950 + 990 = 5940."},
 {title:"Рівень 1. Розігрів",type:"choice",q:"2. Запиши добуток 8 · 8 у вигляді квадрата або куба.",options:["8³","3⁸","8²","2⁸"],correct:2,hint:"Квадрат числа — це добуток двох однакових множників.",explain:"8 · 8 = 8²."},
 {title:"Рівень 1. Розігрів",type:"choice",q:"3. Яку остачу отримаємо при діленні 23 на 7?",options:["2","3","4","5"],correct:0,hint:"Знайди найбільше кратне 7, яке не перевищує 23.",explain:"23 = 7 · 3 + 2, тому остача дорівнює 2."},
 {title:"Рівень 1. Розігрів",type:"choice",q:"4. Виконай дію 72 960 : 24.",options:["34","304","3040","340"],correct:2,hint:"Можна поділити 72 960 спочатку на 6, а потім на 4.",explain:"72 960 : 24 = 3040."},
 {title:"Рівень 2. Математичний майстер",type:"fields",q:"5. Спрости вирази.",fields:[{label:"1) x + 7x =",key:"a",placeholder:"Вираз із x"},{label:"2) 5b + 2b − 3b =",key:"b",placeholder:"Вираз із b"}],answers:{a:["8x","8*x"],b:["4b","4*b"]},hint:"Додавай і віднімай коефіцієнти однакових букв.",explain:"x + 7x = 8x; 5b + 2b − 3b = 4b."},
 {title:"Рівень 2. Математичний майстер",type:"fields",q:"6. Знайди значення виразів найзручнішим способом.",fields:[{label:"1) 4 · 49 · 25 =",key:"a",placeholder:"Число"},{label:"2) 27 · 48 + 27 · 52 =",key:"b",placeholder:"Число"}],answers:{a:["4900"],b:["2700"]},hint:"У першому виразі зручно перемножити 4 і 25. У другому винеси 27 за дужки.",explain:"4 · 49 · 25 = 100 · 49 = 4900; 27 · (48 + 52) = 27 · 100 = 2700."},
 {title:"Рівень 3. Супердетектив",type:"fields",q:"7. Спрости вираз 50b · 20 і знайди його значення, якщо b = 17.",fields:[{label:"Спрощений вираз =",key:"a",placeholder:"Вираз із b"},{label:"Значення при b = 17 =",key:"b",placeholder:"Число"}],answers:{a:["1000b","1000*b"],b:["17000"]},hint:"Перемнож числові множники, а потім підстав b = 17.",explain:"50b · 20 = 1000b; якщо b = 17, то 1000 · 17 = 17 000."},
 {title:"Рівень 3. Супердетектив",type:"number",q:"8. Автівка долає 630 км за 7 год. За скільки годин вона подолає цю саму відстань, якщо зменшить швидкість на 20 км/год?",placeholder:"Введи кількість годин",correct:["9"],hint:"Спочатку знайди початкову швидкість. Зменш її на 20 км/год, а тоді поділи відстань на нову швидкість.",explain:"630 : 7 = 90 км/год; 90 − 20 = 70 км/год; 630 : 70 = 9 год."},
 {title:"Фінальний рівень. Остання загадка",type:"choice",q:"9. Як зміниться добуток, якщо один із його множників збільшити у 8 разів, а другий зменшити вдвічі?",options:["Збільшиться у 4 рази","Збільшиться у 6 разів","Збільшиться у 8 разів","Зменшиться у 4 рази"],correct:0,hint:"Зміни множників можна перемножити: 8 · 1/2.",explain:"8 · 1/2 = 4, отже добуток збільшиться у 4 рази."}
];
let index=0,score=0,completed=Array(tasks.length).fill(false),attempts=Array(tasks.length).fill(0);
const $=id=>document.getElementById(id);
function norm(s){return String(s??"").trim().toLowerCase().replace(/\s+/g,"").replace(/×/g,"*").replace(/·/g,"*").replace(/,/g,".");}
function makePath(){
 $("path").innerHTML="";
 for(let i=0;i<tasks.length;i++){
  const n=document.createElement("div");n.className="step"+(completed[i]?" done":"")+(i===index?" current":"");n.textContent=i+1;n.title=`Завдання ${i+1}`;$("path").appendChild(n);
 }
}
function render(){
 const t=tasks[index];
 $("taskNumber").textContent=`Завдання ${index+1} із ${tasks.length}`;
 $("score").textContent=score;$("progressBar").style.width=(score/tasks.length*100)+"%";
 $("taskTitle").textContent=t.title;
 const area=$("questionArea");area.innerHTML="";
 const q=document.createElement("div");q.className="question";q.textContent=t.q;area.appendChild(q);
 if(t.type==="choice"){
  const wrap=document.createElement("div");wrap.className="options";
  t.options.forEach((o,i)=>{const lab=document.createElement("label");lab.className="option";const inp=document.createElement("input");inp.type="radio";inp.name="answer";inp.value=i;const span=document.createElement("span");span.textContent=String.fromCharCode(1040+i)+". "+o;lab.append(inp,span);wrap.appendChild(lab)});area.appendChild(wrap);
 } else if(t.type==="fields"){
  const wrap=document.createElement("div");wrap.className="fields";
  t.fields.forEach(f=>{const lab=document.createElement("label");lab.className="field";lab.textContent=f.label;const inp=document.createElement("input");inp.type="text";inp.id="field_"+f.key;inp.autocomplete="off";inp.placeholder=f.placeholder;lab.appendChild(inp);wrap.appendChild(lab)});area.appendChild(wrap);
 } else {
  const lab=document.createElement("label");lab.className="field";lab.textContent="Твоя відповідь (у годинах)";const inp=document.createElement("input");inp.type="number";inp.id="numericAnswer";inp.min="0";inp.step="any";inp.placeholder=t.placeholder;lab.appendChild(inp);area.appendChild(lab);
 }
 $("feedback").className="feedback";$("feedback").textContent="";
 $("hintBox").className="feedback";$("hintBox").textContent="";
 $("checkBtn").disabled=false;$("checkBtn").style.opacity="1";
 makePath();
}
function getCorrect(){
 const t=tasks[index];
 if(t.type==="choice"){
  const selected=document.querySelector('input[name="answer"]:checked');
  return selected ? Number(selected.value)===t.correct : null;
 }
 if(t.type==="fields"){
  for(const f of t.fields){
   const val=norm($("field_"+f.key)?.value);
   if(!val)return null;
   if(!t.answers[f.key].map(norm).includes(val))return false;
  }
  return true;
 }
 const val=$("numericAnswer")?.value.trim();
 if(!val)return null;
 return t.correct.map(norm).includes(norm(val));
}
function check(){
 if(completed[index])return;
 const result=getCorrect(),fb=$("feedback");attempts[index]++;
 if(result===null){fb.className="feedback show bad";fb.textContent="Спочатку введи відповідь або вибери один із варіантів.";return}
 if(result){
  completed[index]=true;score++;$("score").textContent=score;$("progressBar").style.width=(score/tasks.length*100)+"%";
  fb.className="feedback show good";fb.textContent="Правильно! ⭐ Помічник робить крок до Гру. "+tasks[index].explain;
  $("checkBtn").textContent=index===tasks.length-1?"Побачити підсумок 🏆":"Наступне завдання ➜";
  makePath();
 }else{
  fb.className="feedback show bad";fb.textContent="Не зовсім! Помічник залишається на місці. Перевір обчислення й спробуй ще раз.";
  makePath();
 }
}
function next(){
 if(!completed[index])return;
 if(index<tasks.length-1){index++;$("checkBtn").textContent="Перевірити відповідь";render()}
 else finish();
}
function finish(){
 $("progressBar").style.width="100%";
 $("game").innerHTML=`<div class="summary"><div class="emoji">🏆🍌🎉</div><h2>Пригоду завершено!</h2><p>Ти допоміг помічнику дістатися до Гру!</p><p style="font-size:1.3rem;font-weight:900">Результат: ${score} із ${tasks.length} балів</p><p>${score===9?"Блискуче! Усі завдання виконано правильно!":"Гарна робота! Переглянь пояснення й потренуйся ще."}</p><div class="answers"><strong>Правильні відповіді:</strong><br>1. 5940<br>2. 8²<br>3. Остача 2<br>4. 3040<br>5. 8x; 4b<br>6. 4900; 2700<br>7. 1000b; 17 000<br>8. 9 годин<br>9. Добуток збільшиться у 4 рази.</div><div class="actions"><button class="primary" id="playAgain">Грати ще раз ↻</button></div></div>`;
 $("playAgain").addEventListener("click",()=>location.reload());
}
$("checkBtn").addEventListener("click",()=>{if(completed[index]) next(); else check();});
$("hintBtn").addEventListener("click",()=>{const box=$("hintBox");if(box.classList.contains("show")){box.className="feedback";box.textContent=""}else{box.className="feedback show";box.textContent=tasks[index].hint}});
$("restartBtn").addEventListener("click",()=>{index=0;score=0;completed=Array(tasks.length).fill(false);attempts=Array(tasks.length).fill(0);$("checkBtn").textContent="Перевірити відповідь";render()});
document.addEventListener("keydown",e=>{if(e.key==="Enter" && e.target.tagName==="INPUT"){if(completed[index])next();else check();}});
render();
</script>
</body>
</html>
