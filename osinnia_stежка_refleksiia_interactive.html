.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.choice{background:#fffaf0f2;border:2px solid #f1d6aa;border-radius:23px;padding:17px 18px;display:flex;gap:13px;align-items:center;min-height:126px;cursor:pointer;transition:.18s transform,.18s box-shadow;text-align:left;color:inherit;font:inherit}
.choice:hover,.choice:focus-visible{transform:translateY(-5px);box-shadow:0 10px 25px #422b1833;outline:3px solid #f8c45e;outline-offset:2px}
.emoji{font-size:38px;flex:0 0 48px;text-align:center}.choice h2{font-family:Georgia,serif;font-size:clamp(17px,2vw,24px);margin:0 0 7px}.choice p{font-size:clamp(12px,1.3vw,15px);line-height:1.35;color:#695747;margin:0}.arrow{margin-left:auto;flex:0 0 36px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#ed8b17;color:white;font-size:25px;font-weight:bold;box-shadow:0 2px 0 #b9670d}
.panel{position:absolute;z-index:3;inset:0;display:flex;align-items:center;justify-content:center;padding:22px}
.dialog{width:min(720px,94%);max-height:82%;overflow:auto;background:#fffaf0f5;border:1px solid #e9cda3;border-radius:24px;padding:clamp(20px,3vw,34px);box-shadow:0 15px 45px #321c0b4a}
.dialog .eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;color:#b56a21;text-transform:uppercase;margin-bottom:8px}
.dialog h2{font-family:Georgia,serif;font-size:clamp(23px,3vw,34px);margin:0 0 12px;line-height:1.18}
.dialog p{font-size:clamp(15px,1.6vw,18px);line-height:1.5;margin:0 0 16px;color:#665443}
textarea{width:100%;min-height:115px;resize:vertical;border:2px solid #e7d3b7;border-radius:14px;background:#fffefb;padding:14px;font:inherit;font-size:16px;color:#39281d;outline:none}
textarea:focus{border-color:#d78b30;box-shadow:0 0 0 3px #f4bd5238}
.actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn{border:0;border-radius:999px;padding:12px 19px;font:700 15px inherit;cursor:pointer}.primary{background:#d8791b;color:white;box-shadow:0 3px 0 #a85410}.secondary{background:#eee2d0;color:#5a4634}.btn:hover{filter:brightness(1.04);transform:translateY(-1px)}
.optionlist{display:grid;gap:10px;margin:16px 0}.option{border:1.5px solid #e5cba6;background:#fffdf7;border-radius:14px;padding:12px 15px;text-align:left;font:inherit;font-size:16px;cursor:pointer}.option.selected{background:#f8e5bd;border-color:#cf812c;box-shadow:inset 0 0 0 1px #cf812c}
.completion{text-align:center}.completion .big{font-size:54px;margin-bottom:5px}.summary{background:#f8edda;border-radius:16px;padding:15px;text-align:left;margin-top:12px;white-space:pre-wrap;line-height:1.5}
[hidden]{display:none!important}
footer{text-align:center;color:#806d58;font-size:12px;padding:12px}
@media(max-height:760px) and (min-width:761px){
.hero{min-height:560px;height:auto;max-height:none}
.top-prompt{top:18px;padding:15px 24px}
.landing{padding:16px}
.choice{min-height:104px;padding:13px 15px}
.introline{margin-bottom:10px}
}
@media(max-width:760px){header{height:58px}.kicker{font-size:9px}.hero{height:auto;min-height:790px;background-position:center}.top-prompt{top:16px;padding:16px 18px}.landing{padding:15px;justify-content:flex-end}.introline{margin-bottom:12px}.cards{grid-template-columns:1fr;gap:9px}.choice{min-height:92px;padding:12px 14px}.emoji{font-size:30px}.choice h2{font-size:19px}.choice p{font-size:13px}.arrow{width:32px;height:32px;flex-basis:32px}.panel{padding:14px}.dialog{max-height:85%;padding:22px 18px}.dialog h2{font-size:25px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="brand"><span>🍂</span>Осіння стежка</div><div class="kicker">РЕФЛЕКСІЯ ПІСЛЯ УРОКУ</div></header>
<main>
<section class="hero" id="hero" aria-label="Осінній ліс, хлопчик і дівчинка">
<div class="top-prompt">
 <div class="progress" id="progress"><span class="dot active"></span><span class="dot"></span><span class="dot"></span></div>
 <h1 id="mainTitle">Що забираєш із сьогоднішнього уроку?</h1>
 <p class="prompt-sub" id="mainSub">Обери одну стежку та дай відповідь на запитання.</p>
</div>
<div class="landing" id="landing">
<p class="introline">Кожна стежка — твоє відкриття. Тут немає неправильних відповідей 🌿</p>
<div class="cards">
<button class="choice" data-path="discover"><span class="emoji">💡</span><span><h2>Мої відкриття</h2><p>Що нового я сьогодні дізнався / дізналася?</p></span><span class="arrow">›</span></button>
<button class="choice" data-path="success"><span class="emoji">🎯</span><span><h2>Мої досягнення</h2><p>Що в мене сьогодні добре вийшло?</p></span><span class="arrow">›</span></button>
<button class="choice" data-path="questions"><span class="emoji">🌱</span><span><h2>Мої запитання</h2><p>Що ще хочу з’ясувати або повторити?</p></span><span class="arrow">›</span></button>
</div>
</div>
<div class="panel" id="panel" hidden>
<div class="dialog" id="dialog">
<div class="eyebrow" id="eyebrow">Твоя стежка</div>
<h2 id="questionTitle"></h2>
<p id="questionText"></p>
<div id="answerArea"></div>
<div class="actions"><button class="btn secondary" id="backBtn">← Назад</button><button class="btn primary" id="nextBtn">Далі →</button></div>
</div>
</div>
</section>
<footer>🌰 Зроби паузу, прислухайся до себе й обери те, що важливо саме тобі.</footer>
</main>
<script>
const paths={
 discover:{label:"Стежка відкриттів",icon:"💡",items:[
  ["Що нового або цікавого ти сьогодні відкрив / відкрила?","Пригадай ідею, правило, спосіб чи маленьке відкриття."],
  ["Яка думка або завдання запам’яталися найбільше?","Що саме зробило їх особливими?"],
  ["Як ти можеш використати це знання далі?","У наступному завданні, на іншому уроці чи в житті."]
 ]},
 success:{label:"Стежка досягнень",icon:"🎯",items:[
  ["Що сьогодні в тебе вийшло добре?","Навіть маленький успіх має значення."],
  ["Який крок допоміг тобі впоратися?","Подумай про зусилля, спосіб роботи або підтримку."],
  ["Чим ти можеш пишатися після цього уроку?","Назви те, що хочеться зберегти у пам’яті."]
 ]},
 questions:{label:"Стежка запитань",icon:"🌱",items:[
  ["Що залишилося незрозумілим або потребує повторення?","Можна записати одне конкретне запитання."],
  ["Що допомогло б тобі розібратися?","Приклад, схема, пояснення, тренування чи допомога."],
  ["Який наступний крок ти обереш?","Що спробуєш зробити, щоб рухатися вперед?"]
 ]}
};
let pathKey=null,step=0,answers=[];
const $=id=>document.getElementById(id);
document.querySelectorAll("[data-path]").forEach(btn=>btn.addEventListener("click",()=>start(btn.dataset.path)));
function start(key){pathKey=key;step=0;answers=["","",""]; $("landing").hidden=true;$("panel").hidden=false;render();}
function render(){
 const p=paths[pathKey],item=p.items[step];
 $("eyebrow").textContent=p.icon+" "+p.label+" · Крок "+(step+1)+" із 3";
 $("questionTitle").textContent=item[0];$("questionText").textContent=item[1];
 $("mainTitle").textContent="Твоя осіння стежка";
 $("mainSub").textContent="Не поспішай. Відповідай так, як відчуваєш.";
 $("progress").innerHTML=[0,1,2].map(i=>`<span class="dot ${i<=step?"active":""}"></span>`).join("");
 $("answerArea").innerHTML="";
 const ta=document.createElement("textarea");ta.placeholder="Моя відповідь… (можна залишити порожньою)";ta.value=answers[step];ta.setAttribute("aria-label","Твоя рефлексивна відповідь");
 ta.addEventListener("input",()=>answers[step]=ta.value);$("answerArea").appendChild(ta);
 $("backBtn").textContent=step===0?"↩ До стежок":"← Назад";
 $("nextBtn").textContent=step===2?"Завершити подорож ✨":"Далі →";
}
$("backBtn").addEventListener("click",()=>{if(step>0){step--;render()}else{ $("panel").hidden=true;$("landing").hidden=false;$("mainTitle").textContent="Що забираєш із сьогоднішнього уроку?";$("mainSub").textContent="Обери одну стежку та дай відповідь на запитання."; $("progress").innerHTML='<span class="dot active"></span><span class="dot"></span><span class="dot"></span>';pathKey=null;}});
$("nextBtn").addEventListener("click",()=>{if(step<2){step++;render()}else finish()});
function finish(){
 const p=paths[pathKey];$("dialog").innerHTML=`<div class="completion"><div class="big">${p.icon} 🍁</div><div class="eyebrow">Подорож завершено</div><h2>Ти пройшов / пройшла свою стежку!</h2><p>Дякую, що прислухався / прислухалася до себе. Твої думки важливі.</p><div class="summary" id="summary"></div><div class="actions"><button class="btn secondary" id="copyBtn">Копіювати відповіді</button><button class="btn primary" id="againBtn">Обрати іншу стежку</button></div></div>`;
 $("summary").textContent=p.items.map((it,i)=>`${i+1}. ${it[0]}\n${answers[i].trim()||"Відповідь не записана."}`).join("\n\n");
 $("copyBtn").addEventListener("click",async()=>{try{await navigator.clipboard.writeText($("summary").textContent);$("copyBtn").textContent="Скопійовано ✓"}catch(e){$("copyBtn").textContent="Виділіть текст і скопіюйте"}});
 $("againBtn").addEventListener("click",()=>window.location.reload());
}
const originalDialog=$("dialog").innerHTML;
</script>
</body></html>
