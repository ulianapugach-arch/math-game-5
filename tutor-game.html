<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Компетентності тьютора</title>
<style>
body{margin:0;background:linear-gradient(135deg,#e9dfd0,#faf7f0);font-family:Arial,sans-serif;color:#17255f}.app{max-width:1200px;margin:auto;padding:25px}h1{font-size:clamp(34px,5vw,58px);margin:0;font-weight:900}.sub{font-size:24px;margin:8px 0 20px;font-weight:700}.score{float:right;background:#fff8d5;border:2px solid #e0c66a;border-radius:14px;padding:12px 18px;font-weight:900;font-size:20px}.portfolios{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin:20px 0}.portfolio{height:125px;border:0;border-radius:10px 18px 18px 10px;box-shadow:4px 7px 10px #0003;cursor:pointer;font-size:30px;font-weight:900;color:#17255f}.portfolio:nth-child(5n+1){background:#5ca0ef}.portfolio:nth-child(5n+2){background:#7ac481}.portfolio:nth-child(5n+3){background:#f2c447}.portfolio:nth-child(5n+4){background:#eb819b}.portfolio:nth-child(5n){background:#a17bd5}.portfolio.active{outline:4px solid #f0b72c;transform:translateY(-4px)}.portfolio.done:after{content:" ✓";color:#237c3b}.portfolio.bad:after{content:" ✕";color:#bd4038}.paper{background:#fffefa;border-radius:20px;padding:35px;box-shadow:5px 10px 22px #0003;background-image:repeating-linear-gradient(transparent,transparent 43px,#dce3ee 44px)}.badges{display:flex;gap:10px;flex-wrap:wrap}.badge{background:#ffedaa;border-radius:18px;padding:8px 17px;font-weight:900}.level{background:#eee1cf}.question{font-size:clamp(22px,3vw,34px);line-height:1.3;font-weight:900;margin:22px 0}.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.answer{min-height:145px;border:0;border-radius:16px;padding:22px;background:#faf8f1;box-shadow:0 4px 9px #0002;font-size:19px;font-weight:800;line-height:1.25;cursor:pointer;color:#17255f}.answer:hover{transform:translateY(-2px)}.answer.correct{background:#e0f2e5;outline:4px solid #399457}.answer.wrong{background:#f8e0dd;outline:4px solid #c34b45}.feedback{min-height:35px;margin-top:18px;font-size:20px;font-weight:900}.controls{display:flex;justify-content:space-between;margin-top:20px}button.nav{border:0;border-radius:13px;padding:12px 25px;color:white;font-size:19px;font-weight:900;cursor:pointer}.back{background:#35a269}.next{background:#3588df}button:disabled{opacity:.4}.center{text-align:center;padding:65px 20px}.center h2{font-size:38px}.big{font-size:72px;font-weight:900}@media(max-width:800px){.portfolios{grid-template-columns:repeat(5,1fr)}.portfolio{height:85px;font-size:22px}.answers{grid-template-columns:1fr}}@media(max-width:500px){.portfolios{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="app"><div class="score">Результат: <span id="score">0</span> / 10</div><h1>Компетентності тьютора</h1><div class="sub">Основні знання, технології та інструменти</div><div class="portfolios" id="portfolios"></div><main id="main"></main></div>
<script>
const Q=[
["Учень 7 класу має значні прогалини у виконанні дій з дробами. Який крок тьютора буде найдоцільнішим на початку роботи?",["Визначити конкретні прогалини через коротку діагностику та побудувати індивідуальний маршрут","Почати з повторення всієї програми 5–6 класів","Одразу дати завдання поточного класу, щоб не відставати"],0],
["Учень знає правило, але не може застосувати його під час розв’язування задачі. Який інструмент тьюторської роботи буде найбільш доцільним?",["Дати учневі ще раз переписати правило","Повідомити правильний алгоритм і попросити його запам’ятати","Запропонувати завдання з поступовим ускладненням і супроводжувати його навідними запитаннями"],2],
["Що є важливою ознакою ефективного зворотного зв’язку в тьюторській роботі?",["Тьютор одразу повідомляє учневі правильну відповідь","Зворотний зв’язок допомагає учневі зрозуміти, що вже виходить і над чим потрібно працювати","Основна увага приділяється кількості допущених помилок"],1],
["Учень успішно виконує завдання з однієї теми, але через тиждень не може відтворити спосіб розв’язання. Який інструмент доцільно використати?",["Організувати повторне звернення до матеріалу через певні проміжки часу","Збільшити кількість однотипних завдань на одному занятті","Замінити всі практичні завдання теоретичним поясненням"],0],
["Що не відповідає принципам побудови індивідуального освітнього маршруту учня?",["Орієнтація на актуальні потреби та можливості учня","Однакова послідовність завдань і тем для всіх учнів незалежно від результатів діагностики","Врахування результатів діагностики"],1],
["Тьютор помітив, що учень постійно помиляється під час виконання одного й того самого типу математичних завдань. Яка дія є найбільш доцільною?",["Перейти до іншої теми, щоб уникнути негативних емоцій учня","Дати значно більшу кількість таких самих вправ","З’ясувати характер помилки та визначити, яке саме знання або вміння є проблемним"],2],
["Яка ситуація найбільшою мірою демонструє саме тьюторський підхід?",["Тьютор допомагає учневі визначити мету, обрати спосіб роботи, аналізувати власний прогрес і поступово передає йому відповідальність за навчання","Тьютор пояснює весь матеріал, а учень виконує запропоновані вправи","Тьютор контролює виконання кожного завдання та виправляє всі помилки учня"],0],
["Учень правильно розв’язав рівняння за відомим алгоритмом. Тьютор хоче перевірити, чи сформувалося саме розуміння способу дії. Яке завдання буде найбільш інформативним?",["Попросити учня пояснити логіку виконаних дій і запропонувати подібне завдання в зміненому контексті","Попросити учня ще раз записати алгоритм розв’язування","Дати ще п’ять рівнянь точно такого самого типу"],0],
["Яка дія тьютора не сприяє поступовому формуванню навчальної самостійності учня?",["Залучення учня до планування власної роботи та аналізу результатів","Постійне виконання складних етапів завдання замість учня, щоб він не припускався помилок","Використання навідних запитань замість готових відповідей"],1],
["Учень має значні освітні втрати з математики, але водночас демонструє низьку мотивацію та невпевненість у власних силах. Яка стратегія тьютора найбільш відповідає комплексному тьюторському підходу?",["Зменшити вимоги до учня та залишити лише найпростіші завдання","Зосередитися виключно на усуненні прогалин у математичних знаннях","Поєднати діагностику навчальних втрат, індивідуальне планування, посильні кроки, підтримувальний зворотний зв’язок і регулярне відстеження прогресу"],2]
];let cur=0,score=0,chosen=Array(10).fill(null);
const P=document.getElementById("portfolios"),M=document.getElementById("main"),S=document.getElementById("score");
function books(){P.innerHTML="";Q.forEach((x,i)=>{let b=document.createElement("button");b.className="portfolio "+(i==cur?"active ":"")+(chosen[i]!=null?(chosen[i]==x[2]?"done":"bad"):"");b.textContent=i+1;b.title="Портфель "+(i+1);b.onclick=()=>{cur=i;render()};P.appendChild(b)})}
function render(){
 books();
 if(chosen.every(x=>x!=null)){M.innerHTML='<section class="paper center"><h2>🎉 Гру завершено!</h2><div class="big">'+score+' / 10</div><p>Ви відповіли на всі 10 запитань.</p><button class="nav next" id="again">Пройти ще раз</button></section>';document.getElementById("again").onclick=()=>{cur=0;score=0;chosen=Array(10).fill(null);S.textContent=0;render()};return}
 let x=Q[cur];M.innerHTML='<section class="paper"><div class="badges"><span class="badge">Запитання '+(cur+1)+' із 10</span><span class="badge level">'+x[3]+' рівень</span></div><div class="question">'+x[0]+'</div><div class="answers"></div><div class="feedback"></div><div class="controls"><button class="nav back" id="prev">← Назад</button><button class="nav next" id="next" disabled>Далі →</button></div></section>';
 let box=M.querySelector(".answers"),fb=M.querySelector(".feedback");
 x[1].forEach((t,i)=>{let b=document.createElement("button");b.className="answer";b.textContent=t;b.onclick=()=>choose(i);box.appendChild(b)});
 document.getElementById("prev").disabled=cur==0;document.getElementById("prev").onclick=()=>{cur--;render()};
 document.getElementById("next").onclick=()=>{if(cur<9){cur++;render()}else render()};
 if(chosen[cur]!=null)show(chosen[cur]);
}
function choose(i){if(chosen[cur]!=null)return;chosen[cur]=i;if(i==Q[cur][2]){score++;S.textContent=score;sound()}show(i);books();document.getElementById("next").disabled=false}
function show(i){let x=Q[cur],bs=[...M.querySelectorAll(".answer")];bs.forEach((b,j)=>{b.disabled=true;if(j==x[2])b.classList.add("correct");if(j==i&&i!=x[2])b.classList.add("wrong")});let f=M.querySelector(".feedback");f.textContent=i==x[2]?"✓ Правильна відповідь!":"Правильна відповідь показана зеленим."}
function sound(){try{let A=window.AudioContext||window.webkitAudioContext;if(!A)return;let c=new A();[523,659,784,1047].forEach((f,i)=>{let o=c.createOscillator(),g=c.createGain(),t=c.currentTime+i*.11;o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.14,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.start(t);o.stop(t+.19)});setTimeout(()=>c.close(),800)}catch(e){}}
render();
</script></body></html>
