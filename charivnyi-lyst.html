<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Чарівний лист</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef6ff,#fff8ed);color:#263238;min-height:100vh}
.wrap{max-width:1000px;margin:auto;padding:28px 18px 40px;text-align:center}
h1{font-size:clamp(30px,5vw,52px);margin:5px 0 8px}
.sub{font-size:18px;margin:0 0 24px;color:#59636b}
.score{font-weight:700;font-size:18px;margin-bottom:20px}
.leaves{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
button{font:inherit}
.leaf{min-height:180px;border:0;border-radius:24px;background:#fff;box-shadow:0 7px 20px #0001;cursor:pointer;padding:18px;transition:.2s}
.leaf:hover{transform:translateY(-5px);box-shadow:0 12px 25px #0002}
.leaf:disabled{opacity:.75;cursor:default;transform:none}
.envelope{font-size:72px;margin-bottom:8px}
.label{font-weight:800;font-size:20px}
.done{font-size:15px;color:#52796f;margin-top:8px}
#task{display:none;margin:26px auto 0;max-width:700px;background:#fff;border-radius:22px;padding:25px;box-shadow:0 8px 24px #0001}
#task h2{margin:0 0 10px;font-size:28px}
.question{font-size:20px;margin:8px 0 20px}
.formula{display:none;font-size:30px;font-weight:800;background:#f1edff;border-radius:15px;padding:16px;margin:15px 0}
.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.action{border:0;border-radius:12px;padding:12px 18px;cursor:pointer;font-weight:700;background:#eee}
.primary{background:#7357d9;color:white}
.feedback{font-size:19px;font-weight:800;min-height:28px;margin-top:15px}
.reset{margin-top:22px;border:1px solid #bbb;background:white;border-radius:10px;padding:10px 16px;cursor:pointer}
@media(max-width:650px){.leaves{grid-template-columns:repeat(2,1fr)}}
@media(max-width:430px){.leaves{grid-template-columns:1fr}.leaf{min-height:150px}}
</style>
</head>
<body>
<div class="wrap">
<h1>✉️ Чарівний лист</h1>
<p class="sub">Обери лист, назви математичну формулу та перевір себе!</p>
<div class="score">Правильних відповідей: <span id="score">0</span> / 6</div>

<div class="leaves" id="leaves"></div>

<section id="task">
<h2 id="title"></h2>
<p class="question">🧠 Назви формулу, не підглядаючи!</p>
<div class="formula" id="formula"></div>
<div class="actions">
<button class="action primary" id="show">Показати формулу</button>
<button class="action" id="right">Я відповів(ла) правильно 👏</button>
</div>
<div class="feedback" id="feedback"></div>
</section>

<button class="reset" id="reset">Почати гру спочатку</button>
</div>

<script>
const items=[
["Різниця квадратів","a² − b² = (a − b)(a + b)"],
["Площа круга","S = πr²"],
["Периметр прямокутника","P = 2(a + b)"],
["Переставна властивість додавання","a + b = b + a"],
["Дискримінант","Δ = b² − 4ac"],
["Обʼєм куба","V = a³"]
];

let current=-1, score=0, done=new Set();
const leaves=document.getElementById("leaves");
const task=document.getElementById("task");
const title=document.getElementById("title");
const formula=document.getElementById("formula");
const feedback=document.getElementById("feedback");

items.forEach((item,i)=>{
 const b=document.createElement("button");
 b.className="leaf"; b.type="button";
 b.innerHTML='<div class="envelope">✉️</div><div class="label">Чарівний лист №'+(i+1)+'</div><div class="done">Відкрий мене!</div>';
 b.onclick=()=>openLetter(i);
 leaves.appendChild(b);
});

function openLetter(i){
 if(done.has(i)) return;
 current=i;
 title.textContent="Лист №"+(i+1)+" — "+items[i][0];
 formula.textContent=items[i][1];
 formula.style.display="none";
 feedback.textContent="";
 task.style.display="block";
 task.scrollIntoView({behavior:"smooth",block:"nearest"});
}

document.getElementById("show").onclick=()=>formula.style.display="block";

document.getElementById("right").onclick=()=>{
 if(current<0 || done.has(current)) return;
 done.add(current); score++;
 document.getElementById("score").textContent=score;
 const b=leaves.children[current];
 b.disabled=true;
 b.querySelector(".done").textContent="✓ Виконано";
 formula.style.display="block";
 feedback.textContent=score===6?"🎉👏 Чудово! Усі формули названо правильно!":"👏 Правильно! Молодець!";
 clap();
};

function clap(){
 try{
  const C=window.AudioContext||window.webkitAudioContext;
  if(!C)return;
  const ctx=new C();
  for(let i=0;i<24;i++){
   const t=ctx.currentTime+i*.045+Math.random()*.025;
   const o=ctx.createOscillator(),g=ctx.createGain();
   o.type="triangle"; o.frequency.value=450+Math.random()*1000;
   g.gain.setValueAtTime(0,t);
   g.gain.linearRampToValueAtTime(.05,t+.008);
   g.gain.exponentialRampToValueAtTime(.001,t+.04);
   o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+.05);
  }
  setTimeout(()=>ctx.close(),1600);
 }catch(e){}
}

document.getElementById("reset").onclick=()=>{
 score=0;current=-1;done.clear();
 document.getElementById("score").textContent="0";
 [...leaves.children].forEach((b,i)=>{
  b.disabled=false;b.querySelector(".done").textContent="Відкрий мене!";
 });
 task.style.display="none";
};
</script>
</body>
</html>
